<!doctype html>
<html lang="tr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<style>
			html, body {
				margin: 0;
				padding: 0;
				background-color: #ffffff;
				color: #141416;
				font-family: 'Public Sans', system-ui, -apple-system, sans-serif;
			}
			@keyframes hp-shimmer {
				0% { background-position: -200% 0; }
				100% { background-position: 200% 0; }
			}
			.hp-skeleton {
				background: linear-gradient(90deg, #f4f4f5 25%, #e4e4e7 50%, #f4f4f5 75%);
				background-size: 200% 100%;
				animation: hp-shimmer 1.5s infinite;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">
			%sveltekit.body%
			<!-- Initial instant skeleton: visible only for the split second before Svelte mounts -->
			<div id="hp-initial-loader" style="min-height: 100vh; display: flex; flex-direction: column;">
				<div style="height: 64px; border-bottom: 1px solid #ebebec; display: flex; align-items: center; padding: 0 24px; gap: 20px;">
					<div style="width: 32px; height: 32px; border-radius: 50%; background: #e11d2e; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 14px;">H</div>
					<div style="font-weight: 800; font-size: 18px; color: #141416; letter-spacing: -0.025em;">HydroPost</div>
					<div style="flex: 1; display: flex; gap: 16px; margin-left: 20px;">
						<div class="hp-skeleton" style="width: 60px; height: 16px; border-radius: 4px;"></div>
						<div class="hp-skeleton" style="width: 60px; height: 16px; border-radius: 4px;"></div>
						<div class="hp-skeleton" style="width: 60px; height: 16px; border-radius: 4px;"></div>
						<div class="hp-skeleton" style="width: 60px; height: 16px; border-radius: 4px;"></div>
					</div>
				</div>
				<div style="max-width: 1280px; width: 100%; margin: 20px auto; padding: 0 16px; box-sizing: border-box;">
					<div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px; min-height: 400px;">
						<div class="hp-skeleton" style="border-radius: 16px; min-height: 400px;"></div>
						<div style="display: flex; flex-direction: column; gap: 16px;">
							<div class="hp-skeleton" style="flex: 1; border-radius: 16px; min-height: 190px;"></div>
							<div class="hp-skeleton" style="flex: 1; border-radius: 16px; min-height: 190px;"></div>
						</div>
					</div>
				</div>
				<script>
					setTimeout(function() {
						var el = document.getElementById('hp-initial-loader');
						if (el) {
							el.style.transition = 'opacity 0.2s ease';
							el.style.opacity = '0';
							setTimeout(function() { if (el && el.parentNode) el.parentNode.removeChild(el); }, 200);
						}
					}, 2000);
				</script>
			</div>
		</div>
	</body>
</html>
