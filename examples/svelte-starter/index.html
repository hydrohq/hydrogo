<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>HydroGo · High-Performance Headless Go CMS & Modern Svelte 5</title>
    <meta name="title" content="HydroGo · High-Performance Headless Go CMS & Modern Svelte 5" />
    <meta name="description" content="Single-binary headless CMS powered by Go and Svelte 5. High-performance REST APIs, instant zero-build publishing, and rich developer tooling." />
    <meta name="keywords" content="HydroGo, headless CMS, Golang CMS, Svelte 5, REST API, zero-build publishing, high performance CMS, developer-first CMS" />
    <meta name="author" content="HydroGo" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#030712" />
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:site_name" content="HydroGo" />
    <meta property="og:title" content="HydroGo · High-Performance Headless Go CMS & Modern Svelte 5" />
    <meta property="og:description" content="Single-binary headless CMS powered by Go and Svelte 5. High-performance REST APIs, instant zero-build publishing, and rich developer tooling." />
    <meta property="og:image" content="https://example.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="HydroGo Headless CMS Architecture" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://example.com/" />
    <meta name="twitter:title" content="HydroGo · High-Performance Headless Go CMS & Modern Svelte 5" />
    <meta name="twitter:description" content="Single-binary headless CMS powered by Go and Svelte 5. High-performance REST APIs, instant zero-build publishing, and rich developer tooling." />
    <meta name="twitter:image" content="https://example.com/og-image.png" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json" id="hydrogo-jsonld-schema">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "HydroGo",
      "url": "https://example.com/",
      "description": "Single-binary headless CMS powered by Go and Svelte 5. High-performance REST APIs, instant zero-build publishing, and rich developer tooling.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://example.com/#docs?q={search_term_string}",
        "query-input": "required name=search_term_string"
      },
      "publisher": {
        "@type": "Organization",
        "name": "HydroGo",
        "url": "https://example.com/"
      }
    }
    </script>
  </head>
  <body class="bg-black text-slate-100 min-h-screen antialiased selection:bg-white selection:text-black">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
