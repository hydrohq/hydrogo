name: content_block
admin:
  label: Content blocks
  description: Build page content from reusable text blocks.
  icon: file-text
  group: content
  use_as_title: title
fields:
  - name: title
    type: string
    required: true
    ui:
      list: true
      searchable: true
  - name: body
    type: text
    required: true
    ui:
      widget: block-editor
