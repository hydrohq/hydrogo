name: project
admin:
  label: Projects
  description: Track active project work.
  icon: briefcase
  group: content
  use_as_title: title
fields:
  - name: title
    type: string
    required: true
    ui:
      list: true
      searchable: true
  - name: status
    type: enum
    required: true
    values: [draft, active, completed]
    ui:
      list: true
      filterable: true
  - name: project_code
    type: string
    required: true
    ui:
      searchable: true
