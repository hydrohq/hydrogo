name: Dependency review

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: hydrogo-dependency-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31d06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 3
        with:
          go-version: '1.27.3'
          check-latest: false
      - name: Verify module graph
        run: go mod verify
      - name: Scan reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Generate deterministic SPDX SBOM
        run: |
          mkdir -p .tmp/dependency-review
          go run ./tools/sbom -output .tmp/dependency-review/hydro-sbom.spdx.json
      - name: Record module graph
        run: go list -m all > .tmp/dependency-review/go-modules.txt
      - name: Upload dependency evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hydrogo-dependency-review-${{ github.run_id }}
          path: .tmp/dependency-review
          if-no-files-found: error
          retention-days: 90
