name: cla
# pull_request_target runs with this repo's token so it can record signatures
# for PRs from forks. It never checks out or runs the PR's code; keep it that way.
on:
  pull_request_target:
    types: [opened, synchronize, closed]
  issue_comment:
    types: [created]
permissions:
  contents: write # commit signatures to the cla-signatures branch
  pull-requests: write
  actions: write
  statuses: write
jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/hydrohq/hydrogo/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: ardaozyildirim,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
