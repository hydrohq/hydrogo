name: CI

on:
  push:
    branches: [main]
  # Only changes headed for the release branch run CI on GitHub. Work on
  # `development` is checked locally with `go run ./tools/check`.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hydrogo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check git diff formatting
        run: git diff --check
      - name: Validate container hardening markers
        run: bash scripts/container-lint.sh
      - name: Scan tracked files for high-confidence credentials
        run: bash scripts/secret-lint.sh
      - name: Build reproducible OCI image (no push)
        run: docker build --pull --platform linux/${{ matrix.arch }} --build-arg TARGETARCH=${{ matrix.arch }} --tag hydrogo:ci-${{ matrix.arch }} .

  first-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
      - name: Install, scaffold and serve like a new user
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/hydro" ./cmd/hydro
          cd "$RUNNER_TEMP"
          printf '%s' 'Quartz-Meadow-4417-lantern' | ./hydro new smoke --preset blog --admin-email ci@example.com --admin-password-stdin
          cd smoke
          ../hydro content-type new recipes
          ../hydro content-type validate
          ../hydro serve --config config.yaml > serve.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/api/v1/content/faq
          curl -fsS http://127.0.0.1:8080/admin/ >/dev/null
          kill $pid || true

  sveltekit-starter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check, build and smoke-test the SvelteKit starter
        working-directory: examples/sveltekit-starter
        run: |
          npm ci
          npm run check
          npm run build
          npm run smoke

  crm-starter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check, build and smoke-test the CRM panel
        working-directory: examples/crm-starter
        run: |
          npm ci
          npm run check
          npm run build
          npm test

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hydro
          POSTGRES_PASSWORD: hydro-test-password
          POSTGRES_DB: hydro_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hydro -d hydro_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HYDRO_TEST_POSTGRES_URL: postgres://hydro_contract_test:hydro-contract-test-password@127.0.0.1:5432/hydro_contract?sslmode=disable
      HYDRO_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      HYDRO_PG_DUMP: /usr/lib/postgresql/18/bin/pg_dump
      HYDRO_PG_RESTORE: /usr/lib/postgresql/18/bin/pg_restore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check git diff formatting
        run: git diff --check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 3
        with:
          go-version: '1.27.3'
          check-latest: false
      - name: Verify workflow action pins
        run: go run ./tools/actionguard
      - name: Enforce staff mobile API compatibility baseline
        run: go run ./tools/openapidiff --baseline docs/api/baselines/mobile-v1.openapi.json --current docs/api/mobile-v1.openapi.json
      - name: Enforce consumer member mobile API compatibility baseline
        run: go run ./tools/openapidiff --baseline docs/api/baselines/member-mobile-v1.openapi.json --current docs/api/member-mobile-v1.openapi.json
      - name: Enforce public content API compatibility baseline
        run: go run ./tools/openapidiff --baseline docs/api/baselines/public-content-v1.openapi.json --current docs/api/public-content-v1.openapi.json
      - name: Install PostgreSQL client tools
        timeout-minutes: 4
        run: |
          if [ ! -x /usr/lib/postgresql/18/bin/pg_dump ] || [ ! -x /usr/lib/postgresql/18/bin/pg_restore ]; then
            sudo install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
            echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo \"$VERSION_CODENAME\")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-client-18
          fi
          test -x /usr/lib/postgresql/18/bin/pg_dump
          test -x /usr/lib/postgresql/18/bin/pg_restore
      - name: Configure non-superuser PostgreSQL contract role
        env:
          PGPASSWORD: hydro-test-password
        run: |
          psql -h 127.0.0.1 -U hydro -d hydro_contract -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE hydro_contract_test LOGIN PASSWORD 'hydro-contract-test-password' NOSUPERUSER CREATEDB NOCREATEROLE NOBYPASSRLS" \
            -c "GRANT CONNECT, CREATE ON DATABASE hydro_contract TO hydro_contract_test" \
            -c "GRANT USAGE, CREATE ON SCHEMA public TO hydro_contract_test"
      - run: go mod verify
      - name: Scan dependencies for reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: test -z "$(gofmt -l .)"
      - name: Run GoSec security scanner
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -exclude-dir=.tmp ./...
      - run: go vet ./...
      - run: go test ./... -count=1 -p 1 -timeout=5m
      - name: Run PostgreSQL adapter contract matrix
        run: go test ./tests/contract -run '^TestPostgres' -count=1 -p 1 -timeout=5m
      - name: Risk-weighted coverage floors
        run: bash scripts/risk-coverage.sh
      - name: Run shuffled test suite
        run: go test ./... -shuffle=on -count=1 -p 1 -timeout=5m
      - name: Measure shuffled test stability
        env:
          HYDRO_TEST_STABILITY_RUNS: '3'
          HYDRO_TEST_STABILITY_REPORT: .tmp/test-stability.json
        run: bash scripts/measure-test-stability.sh
      - name: Upload test stability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hydrogo-test-stability
          path: .tmp/test-stability.json
          if-no-files-found: warn
      - run: go build -ldflags "-X main.buildCommit=${GITHUB_SHA} -X main.buildTime=ci" ./cmd/hydro
      - name: Verify reproducible hydro build
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p .tmp/repro
          go build -trimpath -buildvcs=false -ldflags "-X main.buildCommit=${GITHUB_SHA} -X main.buildTime=ci -buildid=" -o .tmp/repro/hydro-a ./cmd/hydro
          go build -trimpath -buildvcs=false -ldflags "-X main.buildCommit=${GITHUB_SHA} -X main.buildTime=ci -buildid=" -o .tmp/repro/hydro-b ./cmd/hydro
          test "$(sha256sum .tmp/repro/hydro-a | cut -d' ' -f1)" = "$(sha256sum .tmp/repro/hydro-b | cut -d' ' -f1)"
      - name: Enforce code shape (no HTML in Go strings, file size ratchet)
        run: go run ./tools/codeguard
      - name: Enforce internal module boundaries
        run: go run ./tools/moduleguard -root modules -allow modules/api -dependencies modules/dependencies.json
      - name: Enforce migration metadata consistency
        run: go run ./tools/migrationguard -root migrations
      - name: Run Linux binary health/readiness smoke
        run: bash ./scripts/smoke-local.sh
      - name: Run bounded fuzz smoke suite
        run: |
          go test ./extension/v1 -run '^$' -fuzz '^FuzzSafeThemePath$' -fuzztime=2s
          go test ./extension/v1 -run '^$' -fuzz '^FuzzThemeManifestValidate$' -fuzztime=2s
          go test ./internal/canonical -run '^$' -fuzz '^FuzzPath$' -fuzztime=2s
          go test ./internal/canonical -run '^$' -fuzz '^FuzzEmail$' -fuzztime=2s
          go test ./internal/config -run '^$' -fuzz '^FuzzLoadEnvironmentValues$' -fuzztime=2s
          go test ./internal/content -run '^$' -fuzz '^FuzzValidateRichText$' -fuzztime=2s
          go test ./internal/database -run '^$' -fuzz '^FuzzDiscoverMigrations$' -fuzztime=2s
          go test ./internal/portable -run '^$' -fuzz '^FuzzUnmarshalPortable$' -fuzztime=2s
          go test ./internal/security -run '^$' -fuzz '^FuzzCSRFMiddlewareTokens$' -fuzztime=2s
          go test ./internal/security -run '^$' -fuzz '^FuzzSafeReturnPath$' -fuzztime=2s
          go test ./internal/webhooks -run '^$' -fuzz '^FuzzValidateWebhookURL$' -fuzztime=2s
          go test ./internal/webhooks -run '^$' -fuzz '^FuzzWebhookSignature$' -fuzztime=2s
      - name: Prove Go internal boundary
        working-directory: tests/fixtures/internal-import-denied
        run: |
          if go build ./... 2> build.err; then
            echo "forbidden internal import unexpectedly compiled"
            exit 1
          fi
          grep -q "use of internal package .* not allowed" build.err

  windows-go:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 3
        with:
          go-version: '1.27.3'
          check-latest: false
      - name: Verify format, vet, tests and build
        shell: pwsh
        run: |
          git diff --check
          $formatted = gofmt -l .
          if ($formatted) { Write-Error "gofmt required: $formatted" }
          go mod verify
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -exclude-dir=.tmp ./...
          go vet ./...
          go test ./... -count=1 -p 1 -timeout=5m
          go test ./... -shuffle=on -count=1 -p 1 -timeout=5m
          go build -ldflags "-X main.buildCommit=$env:GITHUB_SHA -X main.buildTime=ci" ./cmd/hydro
      - name: Verify reproducible hydro build
        timeout-minutes: 3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tmp/repro | Out-Null
          $ldflags = "-X main.buildCommit=$env:GITHUB_SHA -X main.buildTime=ci -buildid="
          go build -trimpath -buildvcs=false -ldflags $ldflags -o .tmp/repro/hydro-a.exe ./cmd/hydro
          go build -trimpath -buildvcs=false -ldflags $ldflags -o .tmp/repro/hydro-b.exe ./cmd/hydro
          $a = (Get-FileHash .tmp/repro/hydro-a.exe -Algorithm SHA256).Hash
          $b = (Get-FileHash .tmp/repro/hydro-b.exe -Algorithm SHA256).Hash
          if ($a -ne $b) { Write-Error "reproducible build digests differ: $a / $b" }
      - name: Verify build-tag footprints
        shell: pwsh
        run: |
          go test -tags hydro_compact ./internal/database ./internal/tenant ./internal/config -count=1
          go test -tags hydro_compact ./cmd/hydro ./internal/database ./internal/tenant ./internal/config -count=1
          go test -tags hydro_no_otlp ./cmd/hydro ./internal/observability -count=1
          go test -tags hydro_compact,hydro_no_otlp ./cmd/hydro ./internal/config ./internal/database ./internal/tenant ./internal/observability -count=1
          go test -tags hydro_no_s3 ./cmd/hydro ./internal/config ./internal/media -count=1
          go test -tags hydro_compact,hydro_no_otlp,hydro_no_s3 ./cmd/hydro ./internal/config ./internal/database ./internal/tenant ./internal/observability ./internal/media -count=1
          Remove-Item Env:HYDRO_REDIS_URL -ErrorAction SilentlyContinue
          go test -tags hydro_no_redis ./cmd/hydro ./internal/config ./internal/cache ./internal/security ./internal/security/bffsession ./internal/server -count=1
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
          go test -tags hydro_compact,hydro_no_otlp,hydro_no_s3,hydro_no_redis ./cmd/hydro ./internal/config ./internal/database ./internal/tenant ./internal/observability ./internal/media ./internal/cache ./internal/security ./internal/security/bffsession ./internal/server -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Lint theme token references
      - name: Check ADR index drift
        shell: pwsh
        run: ./scripts/adr-drift-check.ps1

  browser-e2e:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 3
        with:
          go-version: '1.27.3'
          check-latest: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'
      - name: Install isolated browser-test dependencies
        shell: pwsh
        run: |
          Push-Location e2e
          try {
            npm ci
            npx playwright install chromium
          } finally { Pop-Location }
          Push-Location packages/client
          try { npm ci } finally { Pop-Location }
      - name: Run generated browser journeys against an isolated SQLite server
        shell: pwsh
        env:
          HYDRO_E2E_ADMIN_PASSWORD: ci-only-e2e-password
        run: powershell -ExecutionPolicy Bypass -File .\scripts\run-e2e.ps1
      - name: Upload browser failure artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hydrogo-browser-artifacts
          path: |
            e2e/artifacts
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hydro
          POSTGRES_PASSWORD: hydro-test-password
          POSTGRES_DB: hydro_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hydro -d hydro_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HYDRO_TEST_POSTGRES_URL: postgres://hydro_contract_test:hydro-contract-test-password@127.0.0.1:5432/hydro_contract?sslmode=disable
      HYDRO_PG_DUMP: /usr/lib/postgresql/18/bin/pg_dump
      HYDRO_PG_RESTORE: /usr/lib/postgresql/18/bin/pg_restore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 3
        with:
          go-version: '1.27.3'
          check-latest: false
      - name: Install PostgreSQL client tools
        timeout-minutes: 4
        run: |
          if [ ! -x /usr/lib/postgresql/18/bin/pg_dump ] || [ ! -x /usr/lib/postgresql/18/bin/pg_restore ]; then
            sudo install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
            echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo \"$VERSION_CODENAME\")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-client-18
          fi
          test -x /usr/lib/postgresql/18/bin/pg_dump
          test -x /usr/lib/postgresql/18/bin/pg_restore
      - name: Configure non-superuser PostgreSQL contract role
        env:
          PGPASSWORD: hydro-test-password
        run: |
          psql -h 127.0.0.1 -U hydro -d hydro_contract -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE hydro_contract_test LOGIN PASSWORD 'hydro-contract-test-password' NOSUPERUSER CREATEDB NOCREATEROLE NOBYPASSRLS" \
            -c "GRANT CONNECT, CREATE ON DATABASE hydro_contract TO hydro_contract_test" \
            -c "GRANT USAGE, CREATE ON SCHEMA public TO hydro_contract_test"
      - name: Run race-sensitive contract tests
        env:
          CGO_ENABLED: '1'
        run: go test -race -p 1 -count=1 -timeout=5m ./internal/... ./modules/... ./cmd/hydro ./tests/contract
