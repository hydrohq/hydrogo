name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hydrogo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hydro
          POSTGRES_PASSWORD: hydro-test-password
          POSTGRES_DB: hydro_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hydro -d hydro_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HYDRO_TEST_POSTGRES_URL: postgres://hydro:hydro-test-password@127.0.0.1:5432/hydro_contract?sslmode=disable
      HYDRO_PG_DUMP: /usr/lib/postgresql/18/bin/pg_dump
      HYDRO_PG_RESTORE: /usr/lib/postgresql/18/bin/pg_restore
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          check-latest: false
      - name: Install PostgreSQL client tools
        run: |
          if [ ! -x /usr/lib/postgresql/18/bin/pg_dump ] || [ ! -x /usr/lib/postgresql/18/bin/pg_restore ]; then
            sudo install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
            echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo \"$VERSION_CODENAME\")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-client-18
          fi
          test -x /usr/lib/postgresql/18/bin/pg_dump
          test -x /usr/lib/postgresql/18/bin/pg_restore
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/hydro
      - name: Verify reproducible hydro build
        run: |
          set -euo pipefail
          mkdir -p .tmp/repro
          go build -trimpath -buildvcs=false -ldflags=-buildid= -o .tmp/repro/hydro-a ./cmd/hydro
          go build -trimpath -buildvcs=false -ldflags=-buildid= -o .tmp/repro/hydro-b ./cmd/hydro
          test "$(sha256sum .tmp/repro/hydro-a | cut -d' ' -f1)" = "$(sha256sum .tmp/repro/hydro-b | cut -d' ' -f1)"
      - name: Enforce Client Edition import boundary
        run: go run ./tools/importguard -root examples/client-edition
      - name: Build external Client Edition
        working-directory: examples/client-edition
        run: go build ./...
      - name: Enforce News Edition import boundary
        run: go run ./tools/importguard -root examples/news-edition
      - name: Build external News Edition
        working-directory: examples/news-edition
        run: go build ./...
      - name: Prove Go internal boundary
        working-directory: tests/fixtures/internal-import-denied
        run: |
          if go build ./... 2> build.err; then
            echo "forbidden internal import unexpectedly compiled"
            exit 1
          fi
          grep -q "use of internal package .* not allowed" build.err

  windows-go:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          check-latest: false
      - name: Verify format, vet, tests and build
        shell: pwsh
        run: |
          $formatted = gofmt -l .
          if ($formatted) { Write-Error "gofmt required: $formatted" }
          go vet ./...
          go test ./...
          go build ./cmd/hydro
      - name: Verify reproducible hydro build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tmp/repro | Out-Null
          go build -trimpath -buildvcs=false -ldflags=-buildid= -o .tmp/repro/hydro-a.exe ./cmd/hydro
          go build -trimpath -buildvcs=false -ldflags=-buildid= -o .tmp/repro/hydro-b.exe ./cmd/hydro
          $a = (Get-FileHash .tmp/repro/hydro-a.exe -Algorithm SHA256).Hash
          $b = (Get-FileHash .tmp/repro/hydro-b.exe -Algorithm SHA256).Hash
          if ($a -ne $b) { Write-Error "reproducible build digests differ: $a / $b" }
