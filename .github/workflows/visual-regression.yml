name: Visual Regression

on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Update visual regression baselines (Requires explicit human approval)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hydrogo-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 3
        with:
          go-version: '1.27.0'
          check-latest: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14.0'
      - name: Install isolated browser-test dependencies
        shell: pwsh
        run: |
          Push-Location e2e
          try {
            npm ci
            npx playwright install chromium
          } finally { Pop-Location }
          Push-Location examples/headless-starter
          try { npm ci } finally { Pop-Location }
      - name: Run visual golden tests with explicit approval
        shell: pwsh
        env:
          HYDRO_E2E_ADMIN_PASSWORD: ci-only-e2e-password
          HYDRO_VISUAL: '1'
        run: |
          if ("${{ inputs.update_snapshots }}" -eq "true") {
            powershell -ExecutionPolicy Bypass -File .\scripts\run-e2e.ps1 -- -g "visual" --update-snapshots
          } else {
            powershell -ExecutionPolicy Bypass -File .\scripts\run-e2e.ps1 -- -g "visual"
          }
      - name: Upload visual artifacts and diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hydrogo-visual-snapshots
          path: |
            e2e/visual.spec.ts-snapshots
            e2e/test-results
            e2e/artifacts
          if-no-files-found: ignore
