version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go

  # The security scanner CI runs lives in its own module (tools/gosec/tools.go).
  - package-ecosystem: gomod
    directory: "/tools/gosec"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - go

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: "/admin"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - javascript

  - package-ecosystem: npm
    directory: "/e2e"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - javascript

  - package-ecosystem: npm
    directory: "/packages/client"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - javascript

  - package-ecosystem: npm
    directory: "/examples/sveltekit-starter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - javascript
  - package-ecosystem: npm
    directory: "/examples/crm-starter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - javascript
