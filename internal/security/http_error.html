<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <style>
    :root {
      --bg: #FAFAF9;
      --card-bg: #FFFFFF;
      --text-main: #1C1917;
      --text-muted: #78716C;
      --border: #E7E5E4;
      --accent: #1C1917;
      --accent-hover: #292524;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 4px 20px -2px rgba(28, 25, 23, 0.05), 0 2px 6px -1px rgba(28, 25, 23, 0.03);
      text-align: center;
    }
    .icon-wrapper {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      background-color: #F5F5F4;
      color: #78716C;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 16px;
      background: #F5F5F4;
      color: #78716C;
      border: 1px solid #E7E5E4;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }
    .explanation {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .meta-box {
      background: #F5F5F4;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 28px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .meta-val {
      user-select: all;
      color: var(--text-main);
      font-weight: 600;
      word-break: break-all;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid transparent;
      user-select: none;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background: var(--accent);
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-outline {
      background: #FFFFFF;
      color: var(--text-main);
      border-color: #D6D3D1;
    }
    .btn-outline:hover {
      background: #F5F5F4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>

    <div class="badge">
      <span>●</span>
      <span>HTTP {{.StatusCode}}</span>
    </div>

    <h1 class="title">{{.Title}}</h1>
    <p class="explanation">{{.Message}}</p>

    <div class="meta-box">
      <div class="meta-row">
        <span>Hata Kodu:</span>
        <span class="meta-val">{{.Code}}</span>
      </div>
      {{if .RequestID}}
      <div class="meta-row">
        <span>İstek ID:</span>
        <span class="meta-val">{{.RequestID}}</span>
      </div>
      {{end}}
    </div>

    <div class="actions">
      <button type="button" class="btn btn-outline" onclick="window.history.back()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Geri Dön
      </button>
      <a href="/" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Ana Sayfa
      </a>
    </div>
  </div>
</body>
</html>
