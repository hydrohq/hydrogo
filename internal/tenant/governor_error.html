<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} — {{.StoreName}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #FAF8F5;
      color: #1C1917;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 520px;
      width: 100%;
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 20px;
      padding: 44px 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 20px;
    }
    .badge-amber {
      background: #FEF3C7;
      color: #92400E;
      border: 1px solid #FCD34D;
    }
    .badge-rose {
      background: #FFE4E6;
      color: #9F1239;
      border: 1px solid #FECDD3;
    }
    .brand {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      color: #1C1917;
      margin-bottom: 12px;
      line-height: 1.25;
    }
    .explanation {
      font-size: 14px;
      color: #57534E;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .meta-box {
      background: #F5F5F4;
      border: 1px solid #E7E5E4;
      border-radius: 10px;
      padding: 12px 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #78716C;
      margin-bottom: 28px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .meta-val {
      user-select: all;
      color: #1C1917;
      font-weight: 500;
      word-break: break-all;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: #1C1917;
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background: #292524;
    }
    .btn-outline {
      background: #FFFFFF;
      color: #1C1917;
      border-color: #D6D3D1;
    }
    .btn-outline:hover {
      background: #F5F5F4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge {{.BadgeClass}}">
      <span>●</span>
      <span>{{.StatusLabel}}</span>
    </div>
    <h1 class="brand">{{.Title}}</h1>
    <p class="explanation">{{.Explanation}}</p>

    <div class="meta-box">
      <div class="meta-row">
        <span>Durum:</span>
        <span class="meta-val">{{.Code}} (HTTP {{.StatusCode}})</span>
      </div>
      <div class="meta-row">
        <span>İstek ID:</span>
        <span class="meta-val">{{.RequestID}}</span>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-outline" onclick="window.location.reload()">
        Sayfayı Yenile
      </button>
      <a href="https://console.example.com" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
        Platform Konsolu
      </a>
    </div>
  </div>
</body>
</html>
