<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HydroGo</title>
<style>
  :root { color-scheme: light dark; --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --fg: #fafaf9; --muted: #a8a29e; --line: #292524; --card: #1c1917; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: min(36rem, 100% - 2rem); padding: 3rem 0; }
  .status { display: inline-flex; align-items: center; gap: .5rem; font-size: .8rem; color: var(--muted); }
  .dot { width: .5rem; height: .5rem; border-radius: 50%; background: #22c55e; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -.03em; line-height: 1.1; margin: 1rem 0 .75rem; font-weight: 600; }
  p { color: var(--muted); margin: 0 0 2rem; }
  .links { display: grid; gap: .75rem; }
  a { display: flex; justify-content: space-between; align-items: center; padding: .9rem 1.1rem; border: 1px solid var(--line); border-radius: .6rem; background: var(--card); color: inherit; text-decoration: none; }
  a:hover { border-color: var(--muted); }
  a span { color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <div class="status"><span class="dot"></span> Server is running</div>
  <h1>HydroGo</h1>
  <p>This is a headless backend: your site or app talks to it over the API. Nothing is published here.</p>
  <div class="links">
    <a href="/admin/">Admin panel <span>/admin</span></a>
    <a href="/api/v1/commerce/checkout-config">API <span>/api/v1</span></a>
    <a href="/healthz">Health <span>/healthz</span></a>
  </div>
</main>
</body>
</html>
