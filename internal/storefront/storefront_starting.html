<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Mağaza Başlatılıyor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #0b0c10; color: #fff; text-align: center; }
    .card { max-width: 480px; padding: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.75rem; }
    p { color: #888; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
    .loader { display: inline-block; width: 28px; height: 28px; border: 2px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1.25rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <meta http-equiv="refresh" content="3">
</head>
<body>
  <div class="card">
    <div class="loader"></div>
    <h1>Mağaza Hazırlanıyor</h1>
    <p>Sistem güncelleniyor. Birkaç saniye içinde sayfa otomatik olarak yüklenecektir.</p>
  </div>
</body>
</html>
