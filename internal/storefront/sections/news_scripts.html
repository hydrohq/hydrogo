{{define "news_scripts"}}
<script>
window.__HP_ARTICLES__ = [
  {{range .FeaturedManset}}
  { title: {{.Title}}, slug: {{.Slug}}, category: {{.CategorySlug}}, excerpt: {{.Excerpt}}, image: {{.ImageURL}}, author: {{.AuthorName}} },
  {{end}}
  {{range .Articles}}
  { title: {{.Title}}, slug: {{.Slug}}, category: {{.CategorySlug}}, excerpt: {{.Excerpt}}, image: {{.ImageURL}}, author: {{.AuthorName}} },
  {{end}}
  {{range .PopularNews}}
  { title: {{.Title}}, slug: {{.Slug}}, category: {{.CategorySlug}}, excerpt: {{.Excerpt}}, image: {{.ImageURL}}, author: {{.AuthorName}} },
  {{end}}
  {{range .SideManset}}
  { title: {{.Title}}, slug: {{.Slug}}, category: {{.CategorySlug}}, excerpt: {{.Excerpt}}, image: {{.ImageURL}}, author: {{.AuthorName}} },
  {{end}}
];

// --- 1. Manşet Carousel Auto-Rotation & Tab Switching ---
let currentMansetIndex = 0;
let mansetTimer = null;
let isMansetPaused = false;

function initMansetCarousel() {
  const slides = document.querySelectorAll('.hp-feature-slide, .hp-carousel-slide');
  if (slides.length <= 1) return;
  startMansetTimer();
}

function startMansetTimer() {
  clearInterval(mansetTimer);
  mansetTimer = setInterval(() => {
    if (!isMansetPaused) {
      const slides = document.querySelectorAll('.hp-feature-slide, .hp-carousel-slide');
      if (!slides.length) return;
      const nextIndex = (currentMansetIndex + 1) % slides.length;
      goToMansetSlide(nextIndex);
    }
  }, 6000);
}

function goToMansetSlide(index) {
  const slides = document.querySelectorAll('.hp-feature-slide, .hp-carousel-slide');
  const dots = document.querySelectorAll('.hp-dot-btn, .hp-tab-btn');
  if (index < 0 || index >= slides.length) return;

  slides.forEach((s, i) => s.classList.toggle('active', i === index));
  dots.forEach((b, i) => b.classList.toggle('active', i === index));
  currentMansetIndex = index;
}

function nextMansetSlide() {
  const slides = document.querySelectorAll('.hp-feature-slide, .hp-carousel-slide');
  if (!slides.length) return;
  goToMansetSlide((currentMansetIndex + 1) % slides.length);
}

function prevMansetSlide() {
  const slides = document.querySelectorAll('.hp-feature-slide, .hp-carousel-slide');
  if (!slides.length) return;
  goToMansetSlide((currentMansetIndex - 1 + slides.length) % slides.length);
}

function pauseManset() {
  isMansetPaused = true;
}

function resumeManset() {
  isMansetPaused = false;
}

// --- 2. Popular News Horizontal Carousel Scroller ---
function scrollPopular(direction) {
  const track = document.getElementById('hpPopularTrack');
  if (!track) return;
  const scrollAmount = 260 * direction;
  track.scrollBy({ left: scrollAmount, behavior: 'smooth' });
}

// --- 3. Font Size Controls ---
let currentFontScale = 0; // -1: small, 0: normal, 1: large
function adjustFontSize(delta) {
  const prose = document.getElementById('hpArticleProse');
  if (!prose) return;
  currentFontScale = Math.max(-1, Math.min(2, currentFontScale + delta));
  if (currentFontScale === -1) {
    prose.style.fontSize = '0.95rem';
    prose.style.lineHeight = '1.75';
  } else if (currentFontScale === 0) {
    prose.style.fontSize = '1.05rem';
    prose.style.lineHeight = '1.85';
  } else if (currentFontScale === 1) {
    prose.style.fontSize = '1.18rem';
    prose.style.lineHeight = '1.95';
  } else if (currentFontScale === 2) {
    prose.style.fontSize = '1.30rem';
    prose.style.lineHeight = '2.05';
  }
}

// --- 4. Text to Speech (TTS) Audio Narration ---
let isSpeaking = false;
let speechSynth = null;
let speechUtterance = null;

function toggleAudioNarration() {
  if (!('speechSynthesis' in window)) {
    alert('Tarayıcınız sesli okuma özelliğini desteklemiyor.');
    return;
  }
  const btn = document.getElementById('hpTTSButton');
  const playIcon = document.getElementById('hpTTSPlayIcon');
  const pauseIcon = document.getElementById('hpTTSPauseIcon');
  const label = document.getElementById('hpTTSText');

  if (isSpeaking) {
    window.speechSynthesis.cancel();
    isSpeaking = false;
    playIcon.classList.remove('hidden');
    pauseIcon.classList.add('hidden');
    label.textContent = 'Haberi Dinle';
    return;
  }

  const headline = document.querySelector('.hp-article-headline')?.innerText || '';
  const lead = document.querySelector('.hp-article-lead-spot')?.innerText || '';
  const body = document.getElementById('hpArticleProse')?.innerText || '';
  const textToRead = `${headline}. ${lead}. ${body}`;

  speechUtterance = new SpeechSynthesisUtterance(textToRead);
  speechUtterance.rate = 1.0;
  speechUtterance.pitch = 1.0;
  speechUtterance.lang = 'tr-TR';

  // Pick Turkish voice if available
  const voices = window.speechSynthesis.getVoices();
  const trVoice = voices.find(v => v.lang.startsWith('tr') || v.name.toLowerCase().includes('turkish'));
  if (trVoice) speechUtterance.voice = trVoice;

  speechUtterance.onend = () => {
    isSpeaking = false;
    playIcon.classList.remove('hidden');
    pauseIcon.classList.add('hidden');
    label.textContent = 'Haberi Dinle';
  };

  speechUtterance.onerror = () => {
    isSpeaking = false;
    playIcon.classList.remove('hidden');
    pauseIcon.classList.add('hidden');
    label.textContent = 'Haberi Dinle';
  };

  window.speechSynthesis.speak(speechUtterance);
  isSpeaking = true;
  playIcon.classList.add('hidden');
  pauseIcon.classList.remove('hidden');
  label.textContent = 'Durdur';
}

// --- 5. Share Article & Copy Link ---
function shareArticle(network) {
  const url = encodeURIComponent(window.location.href);
  const title = encodeURIComponent(document.title);
  if (network === 'twitter') {
    window.open(`https://twitter.com/intent/tweet?text=${title}&url=${url}`, '_blank', 'width=600,height=400');
  } else if (network === 'whatsapp') {
    window.open(`https://api.whatsapp.com/send?text=${title}%20${url}`, '_blank');
  }
}

function copyArticleLink() {
  navigator.clipboard.writeText(window.location.href).then(() => {
    alert('Haber bağlantısı panoya kopyalandı.');
  }).catch(() => {
    const input = document.createElement('input');
    input.value = window.location.href;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
    alert('Haber bağlantısı kopyalandı.');
  });
}

// --- 6. Reader Reactions with localStorage ---
function toggleReaction(type) {
  const el = document.getElementById(`react-count-${type}`);
  if (!el) return;
  const key = `hp_react_${type}_${window.location.pathname}`;
  if (localStorage.getItem(key)) {
    return; // Already reacted
  }
  let count = parseInt(el.textContent, 10) || 0;
  count += 1;
  el.textContent = count;
  localStorage.setItem(key, '1');
  el.parentElement.classList.add('active');
}

// --- 7. Comments Form Submission & KVKK Validation ---
function submitComment(e) {
  e.preventDefault();
  const consent = document.getElementById('hpCommentConsent');
  if (consent && !consent.checked) {
    alert('Lütfen yorumunuzu göndermeden önce Yayın İlkeleri ve KVKK onay kutusunu işaretleyiniz.');
    return;
  }

  const nameInput = document.getElementById('hpCommentAuthor');
  const emailInput = document.getElementById('hpCommentEmail');
  const textInput = document.getElementById('hpCommentBody');
  if (!nameInput || !textInput) return;

  const author = nameInput.value.trim();
  const email = emailInput ? emailInput.value.trim() : '';
  const content = textInput.value.trim();
  if (!author || !content) return;

  // Persist reader info for frictionless return
  localStorage.setItem('hp_reader_name', author);
  if (email) localStorage.setItem('hp_reader_email', email);

  const initials = author.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase() || 'OK';

  const list = document.getElementById('hpCommentsList');
  if (list) {
    const item = document.createElement('div');
    item.className = 'hp-comment-item';
    item.innerHTML = `
      <div class="hp-comment-avatar"><span>${initials}</span></div>
      <div class="hp-comment-content">
        <div class="hp-comment-meta">
          <span class="hp-comment-author">${author}</span>
          <span class="hp-reader-badge" style="font-size:10px; font-weight:800; color:var(--hp-primary); background:var(--hp-primary-light); padding:2px 6px; border-radius:4px;">Doğrulanmış Okur</span>
          <span class="hp-comment-time">Az önce</span>
        </div>
        <p class="hp-comment-text">${content}</p>
      </div>
    `;
    list.prepend(item);
  }

  const badge = document.getElementById('hpCommentsBadge');
  if (badge) {
    const count = (list ? list.children.length : 1);
    badge.textContent = `${count} Yorum`;
  }

  textInput.value = '';
  alert('Yorumunuz editöryal inceleme sırasına alındı ve önizlemeniz eklendi.');
}

// Prefill reader credentials if available
function initCommentReader() {
  const savedName = localStorage.getItem('hp_reader_name');
  const savedEmail = localStorage.getItem('hp_reader_email');
  const nameEl = document.getElementById('hpCommentAuthor');
  const emailEl = document.getElementById('hpCommentEmail');
  const statusEl = document.getElementById('hpCommentReaderStatus');

  if (savedName && nameEl) {
    nameEl.value = savedName;
    if (savedEmail && emailEl) emailEl.value = savedEmail;
    if (statusEl) {
      statusEl.innerHTML = `<span class="hp-reader-hint">Hoş geldiniz <strong>${savedName}</strong>, yorumunuz doğrulanmış okur kimliğinizle yayımlanacaktır.</span>`;
    }
  }
}

// --- 8. Daily Poll Voting with Animated Results ---
function submitPollVote(e, pollId) {
  e.preventDefault();
  const form = document.getElementById('hpPollForm');
  if (!form) return;
  const selected = form.querySelector('input[name="poll_choice"]:checked');
  if (!selected) return;

  const labels = form.querySelectorAll('.hp-poll-label');
  labels.forEach(lbl => {
    const radio = lbl.querySelector('.hp-poll-radio');
    if (radio) radio.disabled = true;
    const bar = lbl.querySelector('.hp-poll-result-bar');
    if (bar) {
      bar.classList.remove('hidden');
      const fill = bar.querySelector('.hp-poll-fill');
      const pct = bar.getAttribute('data-pct') || '33';
      setTimeout(() => { if (fill) fill.style.width = pct + '%'; }, 50);
    }
  });

  const btn = document.getElementById('hpPollVoteBtn');
  if (btn) btn.classList.add('hidden');
  const msg = document.getElementById('hpPollVotedMsg');
  if (msg) msg.classList.remove('hidden');

  localStorage.setItem(`hp_poll_voted_${pollId}`, selected.value);
}

// --- 9. Morning Newsletter Subscription ---
function submitNewsletter(e) {
  e.preventDefault();
  const input = e.target.querySelector('input[type="email"]');
  if (input) input.value = '';
  const success = document.getElementById('hpNewsletterSuccess');
  if (success) success.classList.remove('hidden');
  alert('Aboneliğiniz başarıyla oluşturuldu.');
}

// --- 10. Continuous Infinite Scroll with Viewport URL Sync ---
function trackArticleReadingStream() {
  const articles = document.querySelectorAll('.hp-article-root');
  if (!articles.length) return;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting && entry.intersectionRatio >= 0.25) {
        const slug = entry.getAttribute('data-slug');
        const title = entry.getAttribute('data-title');
        if (slug && window.location.pathname !== `/haber/${slug}`) {
          window.history.replaceState({ slug: slug }, '', `/haber/${slug}`);
          if (title) {
            const parts = document.title.split('—');
            const brand = parts.length > 1 ? parts[parts.length - 1].trim() : 'Nexus Haber';
            document.title = `${title} — ${brand}`;
          }
        }
      }
    });
  }, { threshold: [0.25, 0.5] });

  articles.forEach(art => observer.observe(art));
}

function initInfiniteScroll() {
  const sentinel = document.getElementById('hpInfiniteSentinel');
  if (!sentinel) return;

  trackArticleReadingStream();

  let isLoading = false;
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting && !isLoading) {
        const nextSlug = sentinel.getAttribute('data-next-slug');
        if (!nextSlug) {
          sentinel.style.display = 'none';
          return;
        }

        isLoading = true;
        fetch(`/haber/${nextSlug}`)
          .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.text();
          })
          .then(html => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const nextArticle = doc.getElementById(`article-${nextSlug}`) || doc.querySelector('.hp-article-root');

            if (nextArticle) {
              const stream = document.getElementById('hpArticleStream');
              if (stream) {
                const divider = document.createElement('div');
                divider.className = 'hp-article-stream-divider';
                divider.innerHTML = `<span class="hp-divider-tag">SIRADAKİ HABER</span><div class="hp-divider-line"></div>`;
                stream.insertBefore(divider, sentinel);
                stream.insertBefore(nextArticle, sentinel);
                trackArticleReadingStream();
              }
            }

            // Look for the next article sentinel in the fetched page
            const newSentinel = doc.getElementById('hpInfiniteSentinel');
            if (newSentinel && newSentinel.getAttribute('data-next-slug') && newSentinel.getAttribute('data-next-slug') !== nextSlug) {
              const newerSlug = newSentinel.getAttribute('data-next-slug');
              const newerTitle = newSentinel.getAttribute('data-next-title');
              sentinel.setAttribute('data-next-slug', newerSlug);
              sentinel.setAttribute('data-next-title', newerTitle || '');
              const indicator = sentinel.querySelector('.hp-infinite-indicator strong');
              if (indicator && newerTitle) indicator.textContent = newerTitle;
              isLoading = false;
            } else {
              sentinel.style.display = 'none';
            }
          })
          .catch(err => {
            console.error('Infinite scroll fetch error:', err);
            sentinel.style.display = 'none';
          });
      }
    });
  }, { rootMargin: '400px' });

  observer.observe(sentinel);
}

// --- 11. In-Page Modern Search Modal (Instant Client Autocomplete) ---
function openSearchModal() {
  const overlay = document.getElementById('hpSearchModalOverlay');
  if (overlay) {
    overlay.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    const input = document.getElementById('hpLiveSearchInput');
    if (input) {
      setTimeout(() => input.focus(), 60);
    }
  }
}

function closeSearchModal() {
  const overlay = document.getElementById('hpSearchModalOverlay');
  if (overlay) {
    overlay.style.display = 'none';
    document.body.style.overflow = '';
  }
}

function closeSearchModalOnBackdrop(e) {
  if (e.target && e.target.id === 'hpSearchModalOverlay') {
    closeSearchModal();
  }
}

function clearNewsSearch() {
  const input = document.getElementById('hpLiveSearchInput');
  if (input) {
    input.value = '';
    onNewsSearchInput('');
    input.focus();
  }
}

function searchTag(tag) {
  const input = document.getElementById('hpLiveSearchInput');
  if (input) {
    input.value = tag;
    onNewsSearchInput(tag);
  }
}

function onNewsSearchKeydown(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const input = document.getElementById('hpLiveSearchInput');
    const val = input ? input.value.trim() : '';
    if (val) {
      window.location.href = `/?q=${encodeURIComponent(val)}`;
    }
  } else if (e.key === 'Escape') {
    closeSearchModal();
  }
}

function onNewsSearchInput(val) {
  const clearBtn = document.getElementById('hpSearchClearBtn');
  const promptBox = document.getElementById('hpSearchPrompt');
  const resultsBox = document.getElementById('hpSearchResultsList');
  const emptyBox = document.getElementById('hpSearchEmpty');
  const fullLink = document.getElementById('hpSearchFullLink');

  const q = (val || '').trim().toLowerCase();
  if (clearBtn) clearBtn.classList.toggle('hidden', !q);
  if (fullLink) fullLink.href = `/?q=${encodeURIComponent(val || '')}`;

  if (!q) {
    if (promptBox) promptBox.classList.remove('hidden');
    if (resultsBox) resultsBox.classList.add('hidden');
    if (emptyBox) emptyBox.classList.add('hidden');
    return;
  }

  // Search through articles
  const articles = window.__HP_ARTICLES__ || [];
  const seen = new Set();
  const matched = [];

  for (let i = 0; i < articles.length; i++) {
    const art = articles[i];
    if (!art || !art.slug || seen.has(art.slug)) continue;
    const titleMatch = (art.title || '').toLowerCase().includes(q);
    const excerptMatch = (art.excerpt || '').toLowerCase().includes(q);
    const catMatch = (art.category || '').toLowerCase().includes(q);
    const authorMatch = (art.author || '').toLowerCase().includes(q);

    if (titleMatch || excerptMatch || catMatch || authorMatch) {
      seen.add(art.slug);
      matched.push(art);
      if (matched.length >= 8) break;
    }
  }

  if (promptBox) promptBox.classList.add('hidden');

  if (matched.length > 0) {
    if (emptyBox) emptyBox.classList.add('hidden');
    if (resultsBox) {
      resultsBox.classList.remove('hidden');
      resultsBox.innerHTML = matched.map(art => `
        <a href="/haber/${art.slug}" class="hp-search-res-item">
          <div class="hp-search-res-thumb">
            <img src="${art.image || 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=300&q=80'}" alt="${art.title}">
          </div>
          <div class="hp-search-res-info">
            <span class="hp-search-res-cat">${art.category || 'Gündem'}</span>
            <h4 class="hp-search-res-title">${art.title}</h4>
            <p class="hp-search-res-excerpt">${art.excerpt || ''}</p>
          </div>
        </a>
      `).join('');
    }
  } else {
    if (resultsBox) resultsBox.classList.add('hidden');
    if (emptyBox) emptyBox.classList.remove('hidden');
  }
}

// Global keyboard shortcut
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeSearchModal();
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openSearchModal();
  }
});

// Boot
document.addEventListener('DOMContentLoaded', () => {
  initMansetCarousel();
  initInfiniteScroll();
  initCommentReader();
});
</script>
{{end}}
