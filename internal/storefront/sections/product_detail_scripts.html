{{define "product_detail_scripts"}}
<script>
  let detailPageQty = 1;
  function updateDetailPageQty(delta) {
    detailPageQty = Math.max(1, detailPageQty + delta);
    document.getElementById('detailQty').textContent = detailPageQty;
  }

  function switchGalleryImg(url, btn) {
    document.getElementById('activeMainImg').src = url;
    document.querySelectorAll('.thumb-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
  }

  function toggleAcc(header) {
    const item = header.closest('.accordion-item');
    if (!item) return;
    const isOpen = item.classList.contains('open');
    item.classList.toggle('open', !isOpen);
    const icon = header.querySelector('.accordion-icon');
    if (icon) {
      icon.textContent = isOpen ? '+' : '−';
    }
  }

  const detailProduct = {
    id: {{.Product.ID}},
    title: {{.Product.Title}},
    price: {{.Product.Price}},
    image: {{.Product.ImageURL}},
    options: {{.Product.OptionsJSON}},
    variants: {{.Product.VariantsJSON}}
  };
  const storeWhatsapp = "{{.CleanPhone}}";
  const storeName = "{{.StoreName}}";

  let selectedOptions = {};
  if (detailProduct.options && detailProduct.options.length > 0) {
    detailProduct.options.forEach(opt => {
      if (opt.values && opt.values.length > 0) {
        selectedOptions[opt.name] = opt.values[0];
      }
    });
  }

  function onSelectOption(name, val, btn) {
    selectedOptions[name] = val;
    const row = btn.closest('.options-row');
    if (row) {
      row.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
    }
  }

  /* Toast Notification System */
  let toastTimer = null;
  function showToast(title, desc) {
    const toast = document.getElementById('ecommerceToast');
    if (!toast) return;
    document.getElementById('toastTitle').textContent = title;
    document.getElementById('toastDesc').textContent = desc;
    toast.style.display = 'flex';
    setTimeout(() => {
      toast.style.transform = 'translateY(0)';
      toast.style.opacity = '1';
    }, 10);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.style.transform = 'translateY(100px)';
      toast.style.opacity = '0';
      setTimeout(() => { toast.style.display = 'none'; }, 300);
    }, 3500);
  }

  function addCurrentProductToBag() {
    const selectedOptsSummary = Object.entries(selectedOptions).map(([k, v]) => `${k}: ${v}`).join(', ');
    const itemObj = {
      id: detailProduct.id,
      title: detailProduct.title,
      price: detailProduct.price,
      image_url: detailProduct.image,
      slug: detailProduct.id,
      size: selectedOptions['Beden'] || 'Standart',
      color: selectedOptions['Renk'] || '',
      qty: detailPageQty
    };
    if (typeof addToBag === 'function') {
      addToBag(itemObj);
      showToast('Sepete Eklendi', `${detailProduct.title} (${detailPageQty} adet) eklendi.`);
    } else if (typeof openCartDrawer === 'function') {
      openCartDrawer();
    }
  }

  function addBundleToBag(bId, bTitle, bPrice, bImg) {
    addCurrentProductToBag();
    if (typeof addToBag === 'function') {
      addToBag({
        id: bId,
        title: bTitle,
        price: bPrice,
        image_url: bImg,
        slug: bId,
        size: 'Standart',
        color: '',
        qty: 1
      });
      showToast('Kombin Eklendi', 'Her iki parça da avantajlı fiyatla sepetinizde.');
    }
  }

  /* Legal & KVKK Modal Handlers */
  function openLegalModal(tab) {
    const modal = document.getElementById('kvkkLegalModal');
    if (modal) {
      modal.style.display = 'flex';
      switchLegalTab(tab || 'kvkk');
    }
  }
  function closeLegalModal() {
    const modal = document.getElementById('kvkkLegalModal');
    if (modal) modal.style.display = 'none';
  }
  function handleLegalBackdrop(e) {
    if (e.target.id === 'kvkkLegalModal') closeLegalModal();
  }
  function switchLegalTab(tab) {
    const tabs = ['kvkk', 'mesafe', 'iade'];
    tabs.forEach(t => {
      const btn = document.getElementById('tabBtn' + t.charAt(0).toUpperCase() + t.slice(1));
      const cnt = document.getElementById('tabContent' + t.charAt(0).toUpperCase() + t.slice(1));
      if (btn && cnt) {
        if (t === tab) {
          btn.style.color = '#1C1917';
          btn.style.borderBottom = '2px solid #1C1917';
          btn.style.fontWeight = '700';
          btn.style.background = '#FFFFFF';
          cnt.style.display = 'block';
        } else {
          btn.style.color = '#6B7280';
          btn.style.borderBottom = '2px solid transparent';
          btn.style.fontWeight = '600';
          btn.style.background = 'transparent';
          cnt.style.display = 'none';
        }
      }
    });
  }
  function acceptAndCloseLegalModal() {
    const mCb = document.getElementById('consentMesafe');
    const kCb = document.getElementById('consentKvkk');
    if (mCb) mCb.checked = true;
    if (kCb) kCb.checked = true;
    closeLegalModal();
    showToast('Şartlar Kabul Edildi', 'Mesafeli satış ve KVKK koşulları onaylandı.');
  }

  /* Reviews Drawer & Form Handlers */
  function openAllReviewsModal() {
    const modal = document.getElementById('allReviewsModal');
    if (modal) modal.style.display = 'flex';
  }
  function closeAllReviewsModal() {
    const modal = document.getElementById('allReviewsModal');
    if (modal) modal.style.display = 'none';
  }
  function handleReviewsBackdrop(e) {
    if (e.target.id === 'allReviewsModal') closeAllReviewsModal();
  }
  function filterReviews(star, btn) {
    const list = document.getElementById('fullReviewsList');
    if (!list) return;
    btn.closest('div').querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    btn.classList.add('selected');
    const items = list.querySelectorAll('.review-item-row');
    items.forEach(it => {
      if (star === 'all' || star === 'verified') {
        it.style.display = 'block';
      } else if (it.dataset.stars === star) {
        it.style.display = 'block';
      } else {
        it.style.display = 'none';
      }
    });
  }
  function voteHelpful(btn) {
    if (btn.dataset.voted) return;
    btn.dataset.voted = 'true';
    const m = btn.textContent.match(/\d+/);
    const count = m ? parseInt(m[0], 10) + 1 : 1;
    btn.textContent = `Evet (${count})`;
    btn.style.borderColor = '#16A34A';
    btn.style.color = '#16A34A';
  }

  function openAddReviewModal() {
    closeAllReviewsModal();
    const modal = document.getElementById('addReviewModal');
    if (modal) modal.style.display = 'flex';
  }
  function closeAddReviewModal() {
    const modal = document.getElementById('addReviewModal');
    if (modal) modal.style.display = 'none';
  }
  function handleAddReviewBackdrop(e) {
    if (e.target.id === 'addReviewModal') closeAddReviewModal();
  }
  function selectStarRating(val) {
    document.getElementById('selectedStarValue').value = val;
    const stars = document.querySelectorAll('.star-pick');
    stars.forEach(s => {
      const sVal = parseInt(s.dataset.val, 10);
      s.style.color = sVal <= val ? '#D97706' : '#D1D5DB';
    });
  }
  function submitCustomerReview(e) {
    e.preventDefault();
    const author = document.getElementById('reviewAuthorName').value.trim();
    const size = document.getElementById('reviewAuthorSize').value.trim();
    const comment = document.getElementById('reviewCommentText').value.trim();
    const rating = parseInt(document.getElementById('selectedStarValue').value || '5', 10);
    const starsStr = '★'.repeat(rating) + '☆'.repeat(5 - rating);
    const initials = author.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase() || 'M';

    const newReviewHTML = `
      <div class="review-item-row" data-stars="${rating}" style="border-bottom:1px solid #F3F4F6; padding-bottom:16px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
          <div style="display:flex; align-items:center; gap:10px;">
            <div style="width:34px; height:34px; border-radius:50%; background:#FAF8F5; border:1px solid #E5E7EB; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; color:#1C1917;">${initials}</div>
            <div>
              <div style="font-size:13.5px; font-weight:700; color:#1C1917;">${author} <span style="font-size:11px; font-weight:600; color:#16A34A; background:rgba(22,163,74,0.1); padding:2px 6px; border-radius:4px; margin-left:6px;">Doğrulanmış Alıcı</span></div>
              <div style="font-size:11.5px; color:#9CA3AF;">Beden: ${size} · Şimdi</div>
            </div>
          </div>
          <div style="color:#D97706; font-size:13px;">${starsStr}</div>
        </div>
        <p style="font-size:13.5px; color:#374151; line-height:1.6; margin:0;">${comment}</p>
      </div>
    `;
    const list = document.getElementById('fullReviewsList');
    if (list) list.insertAdjacentHTML('afterbegin', newReviewHTML);
    closeAddReviewModal();
    showToast('Değerlendirmeniz Alındı', 'Yorumunuz editör onayından sonra vitrinde kalıcı olacaktır.');
  }

  async function submitDetailWhatsAppOrder() {
    const mCb = document.getElementById('consentMesafe');
    const kCb = document.getElementById('consentKvkk');
    if ((mCb && !mCb.checked) || (kCb && !kCb.checked)) {
      openLegalModal('mesafe');
      return;
    }

    const selectedOptsSummary = Object.entries(selectedOptions).map(([k, v]) => `${k}: ${v}`).join(', ');
    let orderCode = '#AR-' + Math.floor(1000 + Math.random() * 9000);
    try {
      const res = await fetch('/api/v1/store/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          product_id: detailProduct.id,
          product_title: detailProduct.title,
          price: detailProduct.price,
          quantity: detailPageQty,
          variant_title: selectedOptsSummary
        })
      });
      if (res.ok) {
        const body = await res.json();
        if (body.data && body.data.order_code) {
          orderCode = body.data.order_code;
        }
      }
    } catch (e) {
      console.warn('Order dispatch fallback:', e);
    }

    const msg = `Merhaba ${storeName}, vitrininizdeki "${detailProduct.title}" parçasını (${detailPageQty} adet, ${selectedOptsSummary || 'Standart'}) sipariş etmek istiyorum. Sipariş Kodu: ${orderCode}`;
    const url = `https://wa.me/${storeWhatsapp}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  }
</script>
{{end}}
