version: v0
collection:
  name: testimonial
  table: testimonials
  permissions:
    - testimonial.read
    - testimonial.write
  dialects:
    - sqlite
    - postgres
  fields:
    - name: customer_name
      type: string
      admin:
        label: Müşteri adı
        visible_in_list: true
    - name: quote
      type: string
      admin:
        label: Görüş
        widget: textarea
        visible_in_list: true
    - name: published
      type: boolean
      admin:
        label: Yayında
        visible_in_list: true
  admin:
    label: Referanslar
    description: Müşteri görüşleri için örnek collection spec'i.
    actions:
      - label: Referansları aç
        href: /admin/testimonials
