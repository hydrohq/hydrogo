openapi: 3.0.3
info:
  title: HydroGo Commerce API
  version: 1.0.0
  description: Provider-neutral checkout and payment webhook contract.
servers:
  - url: /
paths:
  /api/v1/commerce/products:
    get:
      operationId: listProducts
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Published products (bounded page; inspect X-Catalog-Has-More for continuation).
          headers:
            X-Catalog-Page: { schema: { type: integer } }
            X-Catalog-Page-Size: { schema: { type: integer } }
            X-Catalog-Has-More: { schema: { type: boolean } }
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Product' } } } }
  /admin/commerce/refunds/pending:
    get:
      operationId: listPendingRefunds
      security: [{ sessionCookie: [] }]
      description: Requires an active administrator session; results must be reconciled against the provider before resolution.
      responses:
        '200': { description: Bounded pending refund projection, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PaymentTransaction' } } } } }
        '403': { description: Administrator access required. }
        '503': { description: Reconciliation projection unavailable. }
  /api/v1/commerce/products/{productID}/variants:
    get:
      operationId: listProductVariants
      parameters:
        - in: path
          name: productID
          required: true
          schema: { type: string }
      responses:
        '200': { description: Published variants, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProductVariant' } } } } }
  /api/v1/commerce/cart:
    get:
      operationId: getCart
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Current cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
  /api/v1/commerce/cart/items:
    post:
      operationId: addCartItem
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CartItemInput' } } }
      responses:
        '200': { description: Updated cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
  /api/v1/commerce/cart/items/{productID}:
    delete:
      operationId: removeCartItem
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: productID
          required: true
          schema: { type: string }
      responses: { '204': { description: Item removed. } }
  /api/v1/commerce/cart/checkout:
    post:
      operationId: checkoutCart
      security:
        - sessionCookie: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '200':
          description: Existing or newly created order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: Invalid request or missing idempotency key. }
        '401': { description: Authentication required. }
        '409': { description: Stock, currency, or idempotency conflict. }
  /api/v1/commerce/orders/{orderID}/payment-intent:
    post:
      operationId: createPaymentIntent
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: orderID
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [stripe, iyzico, paytr] }
      responses:
        '200': { description: Provider payment intent, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentIntent' } } } }
        '403': { description: Order does not belong to the authenticated user. }
        '503': { description: Provider is not configured. }
  /api/v1/webhooks/payment/{provider}:
    post:
      operationId: receivePaymentWebhook
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [stripe, iyzico, paytr] }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object } }
          application/x-www-form-urlencoded: { schema: { type: object } }
      responses:
        '204': { description: Event accepted or safely replayed. }
        '400': { description: Invalid signature, event, or amount. }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hydro_session
  schemas:
    CheckoutRequest:
      type: object
      properties:
        cart_id: { type: string }
        customer:
          $ref: '#/components/schemas/PaymentCustomer'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: string }
              variant_id: { type: string }
              quantity: { type: integer, minimum: 1, maximum: 1000 }
    CartItemInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: string }
        variant_id: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
    Cart:
      type: object
      required: [id, user_id, currency, items, total_cents]
      properties:
        id: { type: string }
        user_id: { type: string }
        currency: { type: string }
        total_cents: { type: integer, format: int64, minimum: 0 }
        items:
          type: array
          items:
            type: object
            required: [product_id, quantity, unit_cents, total_cents]
            properties:
              product_id: { type: string }
              variant_id: { type: string }
              quantity: { type: integer }
              unit_cents: { type: integer, format: int64 }
              total_cents: { type: integer, format: int64 }
    Product:
      type: object
      required: [id, sku, title, price_cents, currency, stock, status]
      properties:
        id: { type: string }
        sku: { type: string }
        title: { type: string }
        price_cents: { type: integer, format: int64 }
        currency: { type: string }
        stock: { type: integer }
        status: { type: string }
    ProductVariant:
      type: object
      required: [id, product_id, sku, title, price_cents, currency, stock, status]
      properties:
        id: { type: string }
        product_id: { type: string }
        sku: { type: string }
        title: { type: string }
        price_cents: { type: integer, format: int64 }
        currency: { type: string }
        stock: { type: integer }
        status: { type: string }
    Order:
      type: object
      required: [id, user_id, currency, items, total_cents, payment_status, shipping_status]
      properties:
        id: { type: string }
        user_id: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        total_cents: { type: integer, format: int64, minimum: 0 }
        payment_status: { type: string, enum: [pending, paid, failed, refunded] }
        shipping_status: { type: string, enum: [pending, processing, shipped, delivered, cancelled] }
        items:
          type: array
          items:
            type: object
            required: [product_id, sku, title, quantity, unit_cents, total_cents]
    PaymentIntent:
      type: object
      required: [id, provider, order_id, amount_cents, currency, status]
      properties:
        id: { type: string }
        provider: { type: string }
        order_id: { type: string }
        amount_cents: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string }
        client_token: { type: string }
        redirect_url: { type: string, format: uri }
    PaymentTransaction:
      type: object
      required: [order_id, provider, provider_payment_id, amount_cents, currency, status]
      properties:
        order_id: { type: string }
        provider: { type: string }
        provider_payment_id: { type: string }
        amount_cents: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        status: { type: string, enum: [refund_pending, refunded] }
    PaymentCustomer:
      type: object
      required: [name, email, phone, address, city, country]
      properties:
        name: { type: string, maxLength: 120 }
        identity_number: { type: string, maxLength: 20, writeOnly: true }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 500 }
        city: { type: string, maxLength: 100 }
        country: { type: string, minLength: 2, maxLength: 2 }
        postal_code: { type: string, maxLength: 20 }
