services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      MINIO_ROOT_USER: hydro-local
      MINIO_ROOT_PASSWORD: hydro-local-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - hydro-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7-alpine
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  hydro-minio:
