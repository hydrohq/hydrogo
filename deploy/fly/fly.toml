# HydroGo on Fly.io: one machine, SQLite on a volume. See docs/deployment.md.
#
# Fly builds from the directory that holds fly.toml, so copy this file to the
# repository root first:
#   cp deploy/fly/fly.toml fly.toml
#   fly launch --no-deploy --copy-config --name <app> --region fra
#   fly secrets set HYDRO_ADMIN_PASSWORD=... HYDRO_HTTP_PUBLIC_ORIGIN=https://<domain>
#   fly deploy --ha=false
app = "hydro-site"
primary_region = "fra"

[build]
  dockerfile = "deploy/paas/Dockerfile"

[env]
  HYDRO_ADMIN_EMAIL = "admin@example.com"

[mounts]
  source = "hydro_data"
  destination = "/app/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  # Stops the machine when idle (saves money). Scheduled work, such as the
  # nightly backup hour, only runs while it is awake: set min_machines_running = 1
  # for sites that need it.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# HydroGo answers 421 to any Host other than its public origin, so a plain TCP
# check is used instead of an HTTP check against /healthz.
[checks]
  [checks.alive]
    type = "tcp"
    port = 8080
    interval = "30s"
    timeout = "3s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
