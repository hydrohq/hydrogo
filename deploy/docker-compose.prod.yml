services:
  caddy:
    image: caddy:2-alpine
    container_name: hydrogo-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_assets:/srv/static:ro
    depends_on:
      hydrogo:
        condition: service_healthy
    networks:
      - hydrogo_net

  hydrogo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: hydrogo-app
    restart: unless-stopped
    user: "10001:10001"
    environment:
      HYDRO_ENV: production
      HYDRO_PROFILE: standard
      HYDRO_HTTP_PORT: "8080"
      HYDRO_HTTP_HOST: "0.0.0.0"
      HYDRO_DATABASE_DRIVER: postgres
      HYDRO_DATABASE_URL_FILE: /run/secrets/db_url
      HYDRO_REDIS_URL_FILE: /run/secrets/redis_url
      HYDRO_SESSION_KEY_FILE: /run/secrets/session_key
      HYDRO_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      HYDRO_S3_ENDPOINT: s3.eu-central-1.amazonaws.com
      HYDRO_S3_BUCKET: hydro-prod-media
      HYDRO_S3_REGION: eu-central-1
      HYDRO_S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      HYDRO_S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      HYDRO_S3_PUBLIC_BASE_URL: https://cdn.example.com
      HYDRO_MAILER_DRIVER: smtp
      HYDRO_MAILER_SMTP_HOST: smtp.sendgrid.net
      HYDRO_MAILER_SMTP_PORT: "587"
      HYDRO_MAILER_SMTP_USER: apikey
      HYDRO_MAILER_SMTP_PASS_FILE: /run/secrets/smtp_pass
      HYDRO_MAILER_FROM_ADDRESS: no-reply@example.com
      HYDRO_MAILER_FROM_NAME: HydroGo Pilot
      HYDRO_OBSERVABILITY_PROMETHEUS: "true"
      HYDRO_LOG_FORMAT: json
      HYDRO_LOG_LEVEL: info
    secrets:
      - db_url
      - redis_url
      - session_key
      - encryption_key
      - s3_access_key
      - s3_secret_key
      - smtp_pass
    volumes:
      - app_data:/var/lib/hydrogo
      - static_assets:/srv/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hydrogo_net
    healthcheck:
      test: ["CMD", "/usr/local/bin/hydro", "doctor", "--check-only"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:18-alpine
    container_name: hydrogo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hydro_prod
      POSTGRES_USER: hydro_app
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    networks:
      - hydrogo_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydro_app -d hydro_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    container_name: hydrogo-redis
    restart: unless-stopped
    command: >
      valkey-server
      --requirepass_file /run/secrets/redis_pass
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    secrets:
      - redis_pass
    volumes:
      - redis_data:/data
    networks:
      - hydrogo_net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

secrets:
  db_url:
    file: ./secrets/db_url.txt
  redis_url:
    file: ./secrets/redis_url.txt
  session_key:
    file: ./secrets/session_key.txt
  encryption_key:
    file: ./secrets/encryption_key.txt
  s3_access_key:
    file: ./secrets/s3_access_key.txt
  s3_secret_key:
    file: ./secrets/s3_secret_key.txt
  smtp_pass:
    file: ./secrets/smtp_pass.txt
  pg_password:
    file: ./secrets/pg_password.txt
  redis_pass:
    file: ./secrets/redis_pass.txt

volumes:
  pg_data:
  redis_data:
  app_data:
  static_assets:
  caddy_data:
  caddy_config:

networks:
  hydrogo_net:
    driver: bridge
