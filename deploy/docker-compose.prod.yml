services:
  caddy:
    image: caddy:2-alpine
    container_name: hydrogo-proxy
    restart: unless-stopped
    environment:
      HYDRO_PUBLIC_HOST: ${HYDRO_PUBLIC_HOST:?set HYDRO_PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_assets:/srv/static:ro
    depends_on:
      hydrogo:
        condition: service_healthy
    networks:
      - hydrogo_net

  hydrogo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: hydrogo-app
    restart: unless-stopped
    user: "10001:10001"
    environment:
      HYDRO_ENV: production
      HYDRO_PUBLIC_ORIGIN: https://${HYDRO_PUBLIC_HOST:-example.com}
      HYDRO_MEDIA_S3_ENDPOINT: ${HYDRO_MEDIA_S3_ENDPOINT:?set HYDRO_MEDIA_S3_ENDPOINT}
      HYDRO_MEDIA_S3_BUCKET: ${HYDRO_MEDIA_S3_BUCKET:?set HYDRO_MEDIA_S3_BUCKET}
      HYDRO_MEDIA_S3_REGION: ${HYDRO_MEDIA_S3_REGION:?set HYDRO_MEDIA_S3_REGION}
      HYDRO_MEDIA_CDN_BASE_URL: ${HYDRO_MEDIA_CDN_BASE_URL:?set HYDRO_MEDIA_CDN_BASE_URL}
      HYDRO_SMTP_HOST: ${HYDRO_SMTP_HOST:?set HYDRO_SMTP_HOST}
      HYDRO_SMTP_PORT: "587"
      HYDRO_SMTP_USERNAME: ${HYDRO_SMTP_USERNAME:?set HYDRO_SMTP_USERNAME}
      HYDRO_SMTP_FROM: ${HYDRO_SMTP_FROM:?set HYDRO_SMTP_FROM}
    secrets:
      - db_url
      - redis_url
      - mfa_master_key
      - s3_access_key
      - s3_secret_key
      - smtp_pass
    volumes:
      - app_data:/var/lib/hydrogo
      - static_assets:/srv/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hydrogo_net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:18-alpine
    container_name: hydrogo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hydro_prod
      POSTGRES_USER: hydro_app
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    networks:
      - hydrogo_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydro_app -d hydro_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    container_name: hydrogo-redis
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command: >
      exec valkey-server --requirepass "$$(tr -d '\\r\\n' < /run/secrets/redis_pass)"
      --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    secrets:
      - redis_pass
    volumes:
      - redis_data:/data
    networks:
      - hydrogo_net
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$(tr -d '\\r\\n' < /run/secrets/redis_pass)\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5

secrets:
  db_url:
    file: ./secrets/db_url.txt
  redis_url:
    file: ./secrets/redis_url.txt
  mfa_master_key:
    file: ./secrets/mfa_master_key.txt
  s3_access_key:
    file: ./secrets/s3_access_key.txt
  s3_secret_key:
    file: ./secrets/s3_secret_key.txt
  smtp_pass:
    file: ./secrets/smtp_pass.txt
  pg_password:
    file: ./secrets/pg_password.txt
  redis_pass:
    file: ./secrets/redis_pass.txt

volumes:
  pg_data:
  redis_data:
  app_data:
  static_assets:
  caddy_data:
  caddy_config:

networks:
  hydrogo_net:
    driver: bridge
