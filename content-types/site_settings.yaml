id: site_settings
label: Site settings
description: "Brand name, tagline and footer texts: a single record edited in the admin."
title_field: site_name
public: true
drafts: false
fields:
  - {id: site_name, label: Site name, kind: text, required: true, list: true}
  - {id: tagline, label: Tagline, kind: text, list: true}
  - {id: seo_title, label: "SEO title (browser tab / search result)", kind: text}
  - {id: seo_description, label: SEO description, kind: textarea}
  - {id: favicon, label: Favicon, kind: media}
  - {id: comments_enabled, label: "Allow comments on articles?", kind: boolean}
  - {id: comments_require_email, label: "Require an email to comment? (simple identification instead of a member login)", kind: boolean}
  - {id: footer_description, label: Footer description, kind: textarea}
  - {id: footer_highlight_title, label: Footer highlight title, kind: text}
  - {id: footer_highlight_text, label: Footer highlight text, kind: textarea}
  - {id: footer_highlight_cta_text, label: Footer highlight button text, kind: text}
  - {id: footer_highlight_cta_href, label: Footer highlight button link, kind: text}
  - {id: copyright_text, label: Copyright text, kind: text}
