id: store_settings
label: Store and Appearance Settings
description: Boutique store identity, color palette, typography and quick-order settings.
group: Store Management
icon: palette
title_field: store_name
public: true
revisions: true
singleton: true
fields:
  - {id: store_name, label: Store Name, kind: text, required: true, list: true}
  - {id: slogan, label: Slogan / Subtitle, kind: text, list: true}
  - {id: logo, label: Store Logo, kind: media}
  - {id: whatsapp_number, label: WhatsApp Order Line (+90...), kind: text, required: true, list: true}
  - {id: instagram_handle, label: Instagram Handle, kind: text}
  - {id: announcement_bar, label: Top Announcement Bar (Shipping / Sale), kind: text}
  - {id: layout_mode, label: Storefront Page Layout, kind: select, options: [hybrid, single_page, multipage]}
  - {id: font_preset, label: Typography & Font Palette, kind: select, options: [v0_geist, editorial_playfair, artisan_garamond, monumental_cinzel, avantgarde_syne, modern_grotesk]}
  - {id: free_shipping_threshold, label: Free Shipping Threshold (TRY), kind: number, min: 0}
  - {id: theme_preset, label: Design Template, kind: select, options: [minimal_cream, noir_gold, pastel_blush, emerald_silk], filterable: true}
  - {id: bg_primary_color, label: Background Color (Hex), kind: text}
  - {id: text_primary_color, label: Primary Text Color (Hex), kind: text}
  - {id: accent_color, label: Accent / Button Color (Hex), kind: text}
  - {id: font_heading, label: Heading Font, kind: select, options: [Cormorant Garamond, Playfair Display, Bodoni Moda, Plus Jakarta Sans]}
  - {id: border_radius_style, label: Corner Roundness, kind: select, options: [sharp, soft, pill]}
  - {id: hero_banner_image, label: Main Storefront Image, kind: media}
  - {id: hero_title, label: Storefront Title, kind: text}
  - {id: hero_cta_text, label: Storefront Button Text, kind: text}
  - {id: layout_json, label: Custom Section Layout (JSON), kind: textarea}
