id: boutique_products
label: Boutique Products
description: Boutique product catalog, prices, size/color options and payment links.
group: Store Management
icon: shopping-bag
title_field: title
public: true
drafts: true
revisions: true
fields:
  - {id: title, label: Product Name, kind: text, required: true, list: true, searchable: true}
  - {id: slug, label: URL Slug, kind: text, required: true, unique: true, list: true, filterable: true}
  - {id: sku, label: SKU, kind: text, unique: true, list: true, searchable: true}
  - {id: category, label: Category, kind: relation, to: boutique_categories, required: true, list: true, filterable: true}
  - {id: price, label: Sale Price (TRY), kind: number, decimals: 2, min: 0, required: true, list: true, filterable: true}
  - {id: compare_at_price, label: Compare-at Price (Struck-through TRY), kind: number, decimals: 2, min: 0, list: true}
  - {id: cover_image, label: Main Product Image, kind: media, list: true}
  - {id: sizes, label: "Mevcut Bedenler (S, M, L, XL)", kind: text, list: true, filterable: true}
  - {id: colors, label: Available Colors, kind: text, list: true, filterable: true}
  - {id: stock_quantity, label: Stock Quantity, kind: number, min: 0, required: true, list: true}
  - {id: badge, label: Storefront Badge, kind: select, options: [New Season, Sold Out, Last 3 Items, Sale, Signature Design], list: true, filterable: true}
  - {id: fabric_care, label: Fabric & Care Information, kind: textarea, searchable: true}
  - {id: description, label: Product Description, kind: richtext, searchable: true}
  - {id: payment_link, label: Quick Payment Link, kind: text}
  - {id: featured, label: Show on Homepage, kind: boolean, list: true, filterable: true}
