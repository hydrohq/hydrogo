id: boutique_orders
label: Boutique Orders
description: Customer orders received through WhatsApp and quick payment.
group: Store Management
icon: package
title_field: order_no
public: false
revisions: true
states:
  field: order_status
  initial: new
  transitions:
    - {from: new, to: confirmed}
    - {from: confirmed, to: shipped}
    - {from: shipped, to: delivered}
    - {from: new, to: cancelled}
fields:
  - {id: order_no, label: Order No., kind: text, sequence: {prefix: "BTK-{yyyy}-", pad: 5}, list: true}
  - {id: customer_name, label: Customer Full Name, kind: text, required: true, list: true, searchable: true}
  - {id: customer_phone, label: Phone (WhatsApp), kind: text, required: true, list: true, searchable: true}
  - {id: shipping_address, label: Delivery Address, kind: textarea, required: true}
  - {id: items_summary, label: Ordered Items (Size/Color), kind: textarea, required: true}
  - {id: total_amount, label: Total Amount (TRY), kind: number, decimals: 2, min: 0, required: true, list: true}
  - {id: order_channel, label: Channel, kind: select, options: [WhatsApp, Credit Card, Bank Transfer, Instagram DM], list: true, filterable: true}
  - {id: order_status, label: Order Status, kind: select, options: [new, confirmed, shipped, delivered, cancelled], list: true, filterable: true}
  - {id: tracking_code, label: Shipment Tracking Code, kind: text, list: true}
