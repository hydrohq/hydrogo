id: homepage_sections
label: Homepage sections
description: Controls which sections appear on the homepage and in what order.
title_field: key
public: true
drafts: false
fields:
  - {id: key, label: Section, kind: select, required: true, list: true, filterable: true, options: [hero, son_haberler, bulten, ikinci_grid, cok_okunan, galeri, kategori_vitrini]}
  - {id: category_filter, label: "Category (only for 'kategori_vitrini'; must match the article category name exactly, e.g. Economy)", kind: text}
  - {id: visible, label: "Visible?", kind: boolean, list: true}
  - {id: sort_order, label: Order, kind: number, required: true, list: true}
