id: homepage_sections
label: Homepage sections
description: Controls which sections appear on the homepage and in what order.
title_field: key
public: true
drafts: false
fields:
  - {id: key, label: Section, kind: select, required: true, list: true, filterable: true, options: [hero, latest_news, newsletter, second_grid, most_read, gallery, category_showcase]}
  - {id: category_filter, label: "Category (only for 'category_showcase'; must match the article category name exactly, e.g. Economy)", kind: text}
  - {id: visible, label: "Visible?", kind: boolean, list: true}
  - {id: sort_order, label: Order, kind: number, required: true, list: true}
