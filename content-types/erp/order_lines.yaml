id: order_lines
label: Order lines
description: One row per product on a sales order.
group: ERP
icon: list
title_field: description
rules:
  - {assert: "quantity > 0", message: "The quantity must be above zero"}
fields:
  - {id: order, label: Order, kind: relation, to: sales_orders, required: true, list: true, filterable: true}
  - {id: product, label: Product, kind: relation, to: products, required: true, list: true, filterable: true}
  - {id: description, label: Description, kind: text, list: true}
  - {id: quantity, label: Quantity, kind: number, decimals: 3, required: true, list: true}
  - {id: unit_price, label: Unit price, kind: number, decimals: 2, min: 0, required: true, list: true}
  - {id: vat_rate, label: VAT rate (%), kind: number, decimals: 2, min: 0, max: 100}
  - {id: line_total, label: Line total, kind: number, decimals: 2, list: true, computed: "quantity * unit_price"}
  - {id: vat_amount, label: VAT, kind: number, decimals: 2, computed: "line_total * vat_rate / 100"}
