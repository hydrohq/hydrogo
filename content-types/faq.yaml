id: faq
label: FAQ
description: Questions and answers shown on the site.
title_field: question
public: true
# drafts: new records start as drafts; the admin publishes them, and only
# published records appear in the public API.
drafts: true
# revisions: keep the last 50 versions of each record; the admin can compare
# and restore them.
revisions: true
# Field flags: list (admin column, sortable), searchable (admin search box and
# the public API's ?search=), filterable (admin filter and ?filter[field]=).
fields:
  - {id: question, label: Question, kind: text, required: true, list: true, searchable: true}
  - {id: answer, label: Answer, kind: richtext, required: true, searchable: true}
  - {id: category, label: Category, kind: select, options: [general, account, billing], list: true, filterable: true}
  - {id: sort_order, label: Order, kind: number, list: true}
