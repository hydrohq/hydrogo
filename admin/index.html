<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/admin/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('hydrogo-theme') || 'system';
          var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (d) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <title>HydroGo Admin</title>
  </head>
  <body class="h-full bg-background font-sans antialiased text-foreground">
    <div id="app" class="h-full">
      <div style="height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;position:relative;overflow:hidden;-webkit-user-select:none;user-select:none;">
        <style>
          .hydro-initial-card{display:flex;flex-direction:column;align-items:center;max-width:320px;width:calc(100% - 32px);padding:32px 24px;border-radius:18px;border:1px solid rgba(148,163,184,0.18);background:rgba(255,255,255,0.7);backdrop-filter:blur(16px);box-shadow:0 20px 40px -15px rgba(0,0,0,0.08);text-align:center}
          .dark .hydro-initial-card{background:rgba(24,24,27,0.7);border-color:rgba(255,255,255,0.08);box-shadow:0 25px 50px -12px rgba(0,0,0,0.5)}
          .hydro-logo-box{width:56px;height:56px;border-radius:14px;background:#18181b;color:#fafafa;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px -4px rgba(0,0,0,0.2);margin-bottom:18px}
          .dark .hydro-logo-box{background:#fafafa;color:#18181b}
          .hydro-track{width:170px;height:4px;border-radius:99px;background:rgba(148,163,184,0.2);overflow:hidden;position:relative;margin:18px 0 14px}
          .hydro-bar{position:absolute;top:0;bottom:0;width:45%;border-radius:99px;background:linear-gradient(90deg,#38bdf8,#6366f1,#38bdf8);animation:h-slide 1.4s cubic-bezier(0.4,0,0.2,1) infinite}
          @keyframes h-slide{0%{left:-45%}100%{left:100%}}
        </style>
        <div class="hydro-initial-card">
          <div class="hydro-logo-box">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
          </div>
          <div style="font-size:18px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;margin-bottom:4px;">
            Hydro<span style="color:#38bdf8;">Go</span>
            <span style="font-size:10px;font-family:monospace;padding:2px 6px;border-radius:99px;background:rgba(56,189,248,0.1);color:#38bdf8;border:1px solid rgba(56,189,248,0.2);margin-left:4px;vertical-align:middle;text-transform:uppercase;">Studio</span>
          </div>
          <div style="font-size:11px;color:#94a3b8;font-weight:500;">Headless Content Management</div>
          <div class="hydro-track">
            <div class="hydro-bar"></div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;font-size:11px;font-family:monospace;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#38bdf8;"></span>
            Loading HydroGo...
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
