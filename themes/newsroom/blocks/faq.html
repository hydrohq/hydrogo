<section class="theme-corporate-faq" data-block="faq">
  <div class="section-head-wrap">
    <h2 class="section-title">Sıkça Sorulan Sorular</h2>
    <p class="section-desc">HydroGo mimarisi, modüler yapısı ve yetenekleri hakkında merak edilenler.</p>
  </div>
  <div class="faq-accordion-list">
    {{range .Payload.items}}
    <details class="faq-item">
      <summary class="faq-question">
        <span class="faq-question-text">{{if .question}}{{.question}}{{else if .Question}}{{.Question}}{{end}}</span>
        <span class="faq-toggle-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </span>
      </summary>
      <div class="faq-answer-body">
        <p>{{if .answer}}{{.answer}}{{else if .Answer}}{{.Answer}}{{end}}</p>
      </div>
    </details>
    {{end}}
  </div>
</section>
